services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: research-work:latest
    env_file:
      - path: .env
        required: false
    environment:
      # Persist Hugging Face / sentence-transformers caches on the host
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence-transformers
    volumes:
      - ./datasets:/app/datasets
      - ./models:/app/models
      - ./results:/app/results
      - huggingface_cache:/app/.cache/huggingface
      - sentence_transformers_cache:/app/.cache/sentence-transformers
    working_dir: /app
    # Examples:
    #   docker compose run --rm app research-route verify
    #   docker compose run --rm app research-pipeline --dataset gaia --limit 1 --route-only
    command: ["research-pipeline", "--help"]

volumes:
  huggingface_cache:
  sentence_transformers_cache:
