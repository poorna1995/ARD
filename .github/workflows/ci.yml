name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python
        run: uv python install 3.11

      - name: Install project
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check config routing orchestrator qce api tests

      - name: Pytest
        run: uv run pytest tests/ -q

      - name: Routing verify
        run: uv run research-route verify --skip-golden

      - name: Optional data layout symlinks
        run: uv run python scripts/setup_data_layout.py

      - name: Verify (new paths)
        run: RESEARCH_USE_NEW_PATHS=1 uv run research-route verify --skip-golden
